            <button type="button" class="btn btn-secondary history-btn" id="undo-btn" title="Undo (Ctrl+Z)" aria-keyshortcuts="Control+Z Meta+Z" disabled>
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.5 6.5h6a3.5 3.5 0 1 1 0 7H6" />
                <path d="M6 4 3.5 6.5 6 9" />
              </svg>
              <span>Undo</span>
            </button>
            <button type="button" class="btn btn-secondary history-btn" id="redo-btn" title="Redo (Ctrl+Shift+Z / Ctrl+Y)" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z Control+Y" disabled>
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12.5 6.5h-6a3.5 3.5 0 1 0 0 7H10" />
                <path d="M10 4l2.5 2.5L10 9" />
              </svg>
              <span>Redo</span>
            </button>
          </div>

          <div class="topbar-divider" aria-hidden="true"></div>

          <div class="segmented" role="group" aria-label="Display Units">
            <button type="button" class="seg-btn active" id="unit-mm-btn" data-unit="mm" aria-pressed="true">mm</button>
            <button type="button" class="seg-btn" id="unit-in-btn" data-unit="in" aria-pressed="false">in</button>
          </div>

          <div class="topbar-divider" aria-hidden="true"></div>

          <button type="button" class="btn btn-secondary" id="new-design-btn" title="Reset parameters, outline, scan, and photo to start a new design">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9.5 2H4.5A1.5 1.5 0 0 0 3 3.5v9A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5V6L9.5 2Z" />
              <path d="M9.5 2v4H13" />
              <path d="M8 8.2v3.6M6.2 10h3.6" />
            </svg>
            <span>New Design</span>
          </button>
          <label class="btn btn-secondary file-btn" title="Import parameters from JSON file (or drop JSON anywhere)">
            <span>Import JSON</span>
            <input type="file" id="json-import-input" class="visually-hidden" accept=".json,application/json" />
          </label>
          <button type="button" class="btn btn-secondary" id="json-export-btn">Export JSON</button>

          <div class="topbar-divider" aria-hidden="true"></div>

          <div class="export-group">
            <label for="stl-export-mode" class="visually-hidden">STL Export Target</label>
            <select id="stl-export-mode" class="select-input compact-select" aria-label="STL Export Target">
              <option value="right">Right Foot (.stl)</option>
              <option value="left">Left Foot (.stl)</option>
              <option value="both-separate">Both Feet (2 .stl in .zip)</option>
              <option value="both-combined">Combined Pair (1 .stl)</option>
            </select>
            <button type="button" class="btn btn-primary" id="stl-export-btn">Export STL</button>
          </div>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar" aria-label="Insole Parameters">
          <div class="sidebar-scroll" id="controls-panel"></div>
        </aside>

        <main class="stage">
          <div class="viewport-toolbar">
            <div class="toolbar-group">
              <div class="segmented" role="tablist" aria-label="Workspace View">
                <button type="button" role="tab" id="tab-3d" class="seg-btn active" data-tab="3d" aria-selected="true" aria-controls="viewport-pane" tabindex="0">3D Viewport</button>
                <button type="button" role="tab" id="tab-trace" class="seg-btn" data-tab="trace" aria-selected="false" aria-controls="trace-pane" tabindex="-1">2D Outline Trace</button>
                <button type="button" role="tab" id="tab-scan" class="seg-btn" data-tab="scan" aria-selected="false" aria-controls="scan-pane" tabindex="-1">3D Scan Import</button>
              </div>

              <div class="segmented" role="group" aria-label="Foot Side Preview" id="side-mode-group">
                <button type="button" class="seg-btn active" data-side="right" aria-pressed="true">Right</button>
                <button type="button" class="seg-btn" data-side="left" aria-pressed="false">Left</button>
                <button type="button" class="seg-btn" data-side="both" aria-pressed="false">Both</button>
              </div>
            </div>

            <div class="toolbar-group" id="viewer-only-controls">
              <div class="segmented" role="group" aria-label="Surface Shading">
                <button type="button" class="seg-btn active" data-shading="solid" aria-pressed="true">Solid</button>
                <button type="button" class="seg-btn" data-shading="elevation" aria-pressed="false">Elevation</button>
                <button type="button" class="seg-btn" data-shading="thickness" aria-pressed="false">Thickness</button>
              </div>

              <button type="button" class="btn btn-ghost toggle-btn" id="wireframe-btn" aria-pressed="false">
                Wireframe
              </button>

              <div class="camera-bar" role="group" aria-label="Camera Presets">
                <button type="button" class="chip-btn" data-cam="perspective" title="3D perspective view" aria-label="3D perspective view">3D</button>
                <button type="button" class="chip-btn" data-cam="top" title="Top footbed view" aria-label="Top footbed view">Top</button>
                <button type="button" class="chip-btn" data-cam="bottom" title="Bottom underside view" aria-label="Bottom underside view">Bottom</button>
                <button type="button" class="chip-btn" data-cam="medial" title="Medial arch side view" aria-label="Medial arch side view">Medial</button>
                <button type="button" class="chip-btn" data-cam="lateral" title="Lateral outer side view" aria-label="Lateral outer side view">Lateral</button>
                <button type="button" class="chip-btn" data-cam="heel" title="Rear heel cup view" aria-label="Rear heel cup view">Heel</button>
              </div>
            </div>
          </div>

          <div class="canvas-area">
            <section class="viewport-pane" id="viewport-pane" role="tabpanel" aria-labelledby="tab-3d">
              <div class="three-host" id="three-container"></div>

              <div class="hud-stats" id="hud-stats" aria-live="polite">
                <div class="hud-stat">
                  <span class="hud-label">Dimensions (L × W × H)</span>
                  <span class="hud-value" id="stat-dims">—</span>
                </div>
                <div class="hud-stat">
                  <span class="hud-label">Volume / Est. TPU</span>
                  <span class="hud-value" id="stat-vol">—</span>
                </div>
                <div class="hud-stat">
                  <span class="hud-label">Triangles</span>
                  <span class="hud-value" id="stat-tris">—</span>
                </div>
                <div class="hud-badge" id="hud-badge" title="2-manifold closed mesh ready for 3D printing slicers">
                  Watertight STL
                </div>
              </div>

              <div class="heatmap-legend" id="heatmap-legend" hidden>
                <span class="legend-title" id="legend-title">Elevation</span>
                <span class="legend-val" id="legend-max">—</span>
                <div class="legend-bar" aria-hidden="true"></div>
                <span class="legend-val" id="legend-min">—</span>
              </div>
            </section>

            <section class="trace-pane" id="trace-pane" role="tabpanel" aria-labelledby="tab-trace" hidden></section>
            <section class="scan-pane" id="scan-pane" role="tabpanel" aria-labelledby="tab-scan" hidden></section>
          </div>

          <section class="cross-section-dock" id="cross-section-dock" aria-label="2D Cross-Section Inspector"></section>
        </main>
      </div>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <dialog class="modal-dialog" id="unsaved-dialog" aria-labelledby="unsaved-dialog-title" aria-describedby="unsaved-dialog-desc">
      <form method="dialog" class="modal-card">
        <h2 class="modal-title" id="unsaved-dialog-title">Save changes before starting a new design?</h2>
        <p class="modal-desc" id="unsaved-dialog-desc">
          You have unexported changes since your last JSON export.
        </p>
        <div class="modal-actions">
          <button type="submit" class="btn btn-danger modal-btn-discard" value="discard">Discard Changes</button>
          <button type="submit" class="btn btn-ghost" value="cancel" autofocus>Cancel</button>
          <button type="submit" class="btn btn-primary" value="save">Export JSON &amp; New</button>
        </div>
      </form>
    </dialog>

  </body>
</html>
